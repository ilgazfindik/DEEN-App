<!doctype html>
<html lang="ar" data-resolution="portrait"
  data-composition-variables='[{"id":"handle","type":"string","label":"Hesap adı","default":"@hesap_adi"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cairo"; font-weight: 700; src: url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Cairo"; font-weight: 700; src: url("assets/fonts/cairo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
      :root {
        --ground: #0E2A22;
        --deep: #0A1D18;
        --cream: #F3EAD7;
        --gold: #D2B373;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--deep); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Cairo", sans-serif; overflow: hidden; }
      #bg {
        position: absolute; inset: 0;
        background: radial-gradient(120% 80% at 50% 42%, #164036 0%, var(--ground) 45%, var(--deep) 100%);
      }
      #pattern { position: absolute; left: -420px; top: -420px; width: 1920px; height: 2760px; opacity: 0.07; }
      #handle {
        position: absolute; top: 296px; left: 80px; z-index: 50;
        font-size: 30px; font-weight: 700; color: var(--cream); opacity: 0.72;
        direction: ltr; display: flex; align-items: center; gap: 10px;
      }
      #handle svg { width: 20px; height: 26px; }
      .step {
        position: absolute; top: 330px; left: 0; right: 0; z-index: 50;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
      }
      .step .count { direction: ltr; font-size: 40px; font-weight: 800; color: var(--gold); letter-spacing: 0.04em; }
      .step .pills { display: flex; gap: 12px; direction: rtl; }
      .step .pill { width: 64px; height: 8px; border-radius: 4px; background: var(--cream); opacity: 0.22; }
      .step .pill.on { background: var(--gold); opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="45" data-track-index="0" style="z-index:0">
        <svg id="pattern" viewBox="0 0 1920 2760">
          <defs>
            <pattern id="star8" width="160" height="160" patternUnits="userSpaceOnUse">
              <g fill="none" stroke="#D2B373" stroke-width="2">
                <rect x="40" y="40" width="80" height="80"/>
                <rect x="40" y="40" width="80" height="80" transform="rotate(45 80 80)"/>
                <path d="M0 80 L23 80 M137 80 L160 80 M80 0 L80 23 M80 137 L80 160"/>
              </g>
            </pattern>
          </defs>
          <rect width="1920" height="2760" fill="url(#star8)"/>
        </svg>
      </div>

      <div id="handle" class="clip" data-start="0" data-duration="45" data-track-index="1">
        <svg viewBox="-28 -42 56 82"><path d="M0 -40 C14 -18 26 -4 26 12 A26 26 0 0 1 -26 12 C-26 -4 -14 -18 0 -40 Z" fill="#D2B373"/></svg>
        <span data-var-text="handle">@hesap_adi</span>
      </div>

      <div id="step1" class="step clip" data-start="13" data-duration="6" data-track-index="1">
        <div class="count">1/3</div>
        <div class="pills"><span class="pill on"></span><span class="pill"></span><span class="pill"></span></div>
      </div>
      <div id="step2" class="step clip" data-start="19" data-duration="4.5" data-track-index="1">
        <div class="count">2/3</div>
        <div class="pills"><span class="pill on"></span><span class="pill on"></span><span class="pill"></span></div>
      </div>
      <div id="step3" class="step clip" data-start="23.5" data-duration="7" data-track-index="1">
        <div class="count">3/3</div>
        <div class="pills"><span class="pill on"></span><span class="pill on"></span><span class="pill on"></span></div>
      </div>

      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="3.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02.html" data-start="3" data-duration="3.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:11"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03.html" data-start="6" data-duration="3.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:12"></div>
      <div id="s04" data-composition-id="s04" data-composition-src="compositions/s04.html" data-start="9.5" data-duration="3.8" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:13"></div>
      <div id="s05" data-composition-id="s05" data-composition-src="compositions/s05.html" data-start="13" data-duration="3.1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:14"></div>
      <div id="s06" data-composition-id="s06" data-composition-src="compositions/s06.html" data-start="15.8" data-duration="3.5" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:15"></div>
      <div id="s07" data-composition-id="s07" data-composition-src="compositions/s07.html" data-start="19" data-duration="4.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:16"></div>
      <div id="s08" data-composition-id="s08" data-composition-src="compositions/s08.html" data-start="23.5" data-duration="3.8" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:17"></div>
      <div id="s09" data-composition-id="s09" data-composition-src="compositions/s09.html" data-start="27" data-duration="3.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:18"></div>
      <div id="s10" data-composition-id="s10" data-composition-src="compositions/s10.html" data-start="30.5" data-duration="3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:19"></div>
      <div id="s11" data-composition-id="s11" data-composition-src="compositions/s11.html" data-start="33.2" data-duration="3.1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:20"></div>
      <div id="s12" data-composition-id="s12" data-composition-src="compositions/s12.html" data-start="36" data-duration="3.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:21"></div>
      <div id="s13" data-composition-id="s13" data-composition-src="compositions/s13.html" data-start="39" data-duration="3.1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:22"></div>
      <div id="s14" data-composition-id="s14" data-composition-src="compositions/s14.html" data-start="41.8" data-duration="3.2" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:23"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#pattern", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 12, duration: 45, ease: "none" }, 0);
      tl.fromTo("#step1 .count, #step1 .pills", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 13);
      tl.fromTo("#step2 .pill.on:nth-child(2)", { opacity: 0.22 }, { opacity: 1, duration: 0.4 }, 19);
      tl.fromTo("#step3 .pill.on:nth-child(3)", { opacity: 0.22 }, { opacity: 1, duration: 0.4 }, 23.5);
      tl.fromTo("#step3 .count, #step3 .pills", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 30.18);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
