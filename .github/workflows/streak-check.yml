name: Streak Check

on:
  pull_request:
    paths:
      - 'assets/design/streak.js'
      - 'assets/i18n/premium-hub.js'
      - 'index.html'
      - 'scripts/test-streak.cjs'
      - '.github/workflows/streak-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Streak card and repair
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/test-streak.cjs
