name: English localization audit
on:
  push:
    branches: [codex/global-locale-20261009, codex/english-visible-copy-fix-20261011, codex/en-quran-hub-20261011, codex/en-quran-submodules-20261011 , codex/en-learning-path-20261011]
    paths: ['assets/i18n/**', 'scripts/**', 'release/**', 'index.html', '.github/workflows/english-localization-audit.yml']
  workflow_dispatch:
jobs:
  structure:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node scripts/audit-english-questions.mjs --require-complete
          node scripts/audit-english-runtime.mjs
          node scripts/build-release-manifest.mjs --check
          node scripts/audit-release.mjs
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        script: [capture-english-ui-candidate, test-english-runtime, test-english-regression, test-english-interactions, test-english-quran, test-english-onboarding, test-english-public]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install actual Google Chrome
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          npx playwright install chrome
      - name: Test real segmented app
        env:
          DEEN_QA_OUTPUT: ${{ runner.temp }}/deen-english-qa
        run: node scripts/${{ matrix.script }}.cjs
      - name: Preserve screenshots and DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deen-english-${{ matrix.script }}
          path: ${{ runner.temp }}/deen-english-qa
