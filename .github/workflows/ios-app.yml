name: iOS App

# Builds the Capacitor iOS shell around the web app.
#  - On pull requests that touch the shell: a simulator build (no signing) proves the Xcode project compiles,
#    and the signing script is tested against a mock of the App Store Connect API.
#  - Run manually with "upload" = true to sign for the App Store, archive and send a build to TestFlight (needs the four secrets below).
#
# Signing needs no registered device and no Development profile: scripts/ios-signing.mjs asks the App Store Connect API
# (the same key as the upload) for a short-lived "Apple Distribution" certificate and an "App Store" provisioning profile,
# the Release configuration signs with them manually, and both are revoked again at the end of the run.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-www.mjs'
      - 'scripts/ios-signing.mjs'
      - 'scripts/test-ios-signing.mjs'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign, archive and upload to TestFlight (needs the App Store Connect secrets)'
        type: boolean
        default: false

permissions:
  contents: read

# bash with pipefail, so a failing xcodebuild is never hidden by `| tail`.
defaults:
  run:
    shell: bash

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Signing script against a mock App Store Connect API
        run: node scripts/test-ios-signing.mjs

  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Select the newest stable Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -iv 'beta\|_rc\|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - name: Build the web bundle and sync it into the iOS project
        run: npm run cap:sync
      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Release signing resolves to Apple Distribution + the App Store profile (no Development profile)
        run: |
          S=$(xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings 2>/dev/null)
          grep -E '^ *(CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|PRODUCT_BUNDLE_IDENTIFIER) =' <<<"$S" | sort -u
          grep -q 'CODE_SIGN_STYLE = Manual' <<<"$S"
          grep -q 'CODE_SIGN_IDENTITY = Apple Distribution' <<<"$S"
          grep -q 'PROVISIONING_PROFILE_SPECIFIER = Ilnura App Store (CI)' <<<"$S"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.ilgazfindik.ilnura' <<<"$S"

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: [signing-test, simulator-build]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # the repository secret names are unchanged
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      BUNDLE_ID: com.ilgazfindik.ilnura
      PROFILE_NAME: Ilnura App Store (CI)
    steps:
      - name: Check the secrets are set
        run: |
          echo "SIGN_DIR=$RUNNER_TEMP/signing" >> "$GITHUB_ENV"
          for v in KEY_ID ISSUER_ID API_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (see docs/ios-testflight.md)"; exit 1; fi
          done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Select the newest stable Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -iv 'beta\|_rc\|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm run cap:sync

      - name: Create the distribution certificate and App Store profile (no devices needed)
        run: |
          node scripts/ios-signing.mjs setup --out "$SIGN_DIR"
          PROFILE_UUID=$(node -p "require('$SIGN_DIR/info.json').profileUuid")
          KC="$RUNNER_TEMP/ilnura-signing.keychain-db"
          KCP=$(openssl rand -hex 16); echo "::add-mask::$KCP"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$SIGN_DIR/dist.p12" -k "$KC" -P "$(cat "$SIGN_DIR/p12.pass")" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN_DIR/AppStore.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done
          echo "KC=$KC" >> "$GITHUB_ENV"
          echo "Signing identities in the build keychain:"
          security find-identity -v -p codesigning "$KC"

      - name: Archive (Apple Distribution + App Store profile)
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -40

      - name: Export and upload to App Store Connect
        run: |
          mkdir -p "$SIGN_DIR/auth"
          printf '%s' "$API_KEY_P8" > "$SIGN_DIR/auth/AuthKey_$KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$SIGN_DIR/auth/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -40

      - name: Revoke the certificate and profile, remove the keys
        if: always()
        run: |
          node scripts/ios-signing.mjs cleanup --out "$SIGN_DIR" || true
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -rf "$SIGN_DIR"
