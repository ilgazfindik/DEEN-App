name: German localization staging audit
on:
  push:
    branches: ['codex/german-*', main]
    paths:
      - 'assets/i18n/questions/de/**'
      - 'assets/i18n/content-support.json'
      - 'scripts/audit-german-staging.mjs'
      - 'scripts/audit-german-runtime-staging.mjs'
      - 'scripts/test-german-content-adapter.mjs'
      - 'scripts/audit-german-ui-staging.mjs'
      - 'scripts/audit-german-lesson-flow-staging.mjs'
      - 'scripts/test-german-dynamic-ui-staging.mjs'
      - 'scripts/audit-german-quran-premium-staging.mjs'
      - 'scripts/audit-german-quran-meaning-inventory.mjs'
      - 'scripts/test-german-fatiha-meaning-staging.mjs'
      - 'scripts/test-german-ikhlas-meaning-staging.mjs'
      - 'scripts/test-german-falaq-meaning-staging.mjs'
      - 'scripts/test-german-nas-meaning-staging.mjs'
      - 'scripts/test-german-kawthar-meaning-staging.mjs'
      - 'scripts/test-german-asr-meaning-staging.mjs'
      - 'scripts/test-german-kafirun-meaning-staging.mjs'
      - 'scripts/test-german-nasr-meaning-staging.mjs'
      - 'scripts/test-german-masad-meaning-staging.mjs'
      - 'assets/i18n/quran/de/**'
      - 'assets/quran/audio/ayah-audio-manifest.json'
      - 'assets/i18n/german-ui.quran-controls.staging.json'
      - 'assets/i18n/german-ui.premium-shop.staging.json'
      - 'assets/i18n/german-ui.dynamic.staging.mjs'
      - 'assets/i18n/german-ui.lesson-flow.staging.json'
      - 'assets/i18n/english-ui.js'
      - 'assets/i18n/german-ui.staging.json'
      - 'assets/i18n/english-ui.draft.json'
      - 'assets/i18n/content.js'
      - 'qa/GERMAN_LOCALIZATION_PROGRESS.md'
      - '.github/workflows/german-localization-audit.yml'
  workflow_dispatch:
jobs:
  german-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify German stage, answers and blocked runtime
        run: node scripts/audit-german-staging.mjs
      - name: Verify active U01 German runtime staging and ID inventory
        run: node scripts/audit-german-runtime-staging.mjs
      - name: Verify German staging against the real source-guarded question adapter
        run: node scripts/test-german-content-adapter.mjs
      - name: Audit staged German UI strings and preserved release gate
        run: node scripts/audit-german-ui-staging.mjs
      - name: Verify German lesson intro, feedback, result and XP staging
        run: node scripts/audit-german-lesson-flow-staging.mjs
      - name: Verify German dynamic counters, results and fail-closed fallback
        run: node scripts/test-german-dynamic-ui-staging.mjs
      - name: Verify German Quran and Premium UI staging without verse fallback
        run: node scripts/audit-german-quran-premium-staging.mjs
      - name: Verify 90 Quran ayahs, audio and outstanding German meaning coverage
        run: node scripts/audit-german-quran-meaning-inventory.mjs
      - name: Test Fatiha seven-ayah German draft and production fail-closed gate
        run: node scripts/test-german-fatiha-meaning-staging.mjs
      - name: Test Ikhlas four-ayah meanings with immutable Arabic and audio guard
        run: node scripts/test-german-ikhlas-meaning-staging.mjs
      - name: Test Al-Falaq 5-ayah meaning source/audio identity and production block
        run: node scripts/test-german-falaq-meaning-staging.mjs
      - name: Test An-Nas six-ayah source/audio identity and production meaning embargo
        run: node scripts/test-german-nas-meaning-staging.mjs
      - name: Test Al-Kawthar meaning drafts and original Arabic/audio guard
        run: node scripts/test-german-kawthar-meaning-staging.mjs
      - name: Test Al-Asr meaning draft Arabic/audio identity and embargo
        run: node scripts/test-german-asr-meaning-staging.mjs
      - name: Verify Kafirun 6-ayah meaning draft identities and no-public-release checks
        run: node scripts/test-german-kafirun-meaning-staging.mjs
      - name: Verify An-Nasr 3-ayah German meaning drafts and original Arabic/audio release protection
        run: node scripts/test-german-nasr-meaning-staging.mjs
      - name: Test Al-Masad five German meaning drafts against Arabic/audio and blocked release
        run: node scripts/test-german-masad-meaning-staging.mjs
      - name: Existing English question bank remains complete
        run: node scripts/audit-english-questions.mjs --require-complete
      - name: Existing English runtime adapter remains valid
        run: node scripts/audit-english-runtime.mjs
      - name: Release hashes remain valid
        run: node scripts/build-release-manifest.mjs --check
