name: Question Duplicate Check

on:
  pull_request:
    paths:
      - 'assets/learn/**'
      - 'scripts/learn-extra/**'
      - 'scripts/apply-retired-questions.mjs'
      - 'scripts/test-retired-questions.cjs'
      - 'release/**'
      - 'index.html'
      - '.github/workflows/question-dedupe-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extra questions and translations
        run: node scripts/test-learn-extra.mjs
      - name: Retired questions are never offered and no exact duplicate is left
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/test-retired-questions.cjs
