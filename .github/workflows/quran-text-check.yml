name: Quran Text Check

on:
  pull_request:
    paths:
      - 'assets/quran/**'
      - 'scripts/*quran*'
      - 'scripts/build-surah-pack.mjs'
      - '.github/workflows/quran-text-check.yml'
  push:
    branches: [main]
    paths:
      - 'assets/quran/**'
      - 'scripts/*quran*'
      - 'scripts/build-surah-pack.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Quran text matches the checked checksums
        run: node scripts/verify-quran-text.mjs
