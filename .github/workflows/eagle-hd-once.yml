name: One-off Eagle HD AVIF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eagle-hd-once.yml"

permissions:
  contents: write

jobs:
  convert-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image codec
        run: python -m pip install --upgrade pillow pillow-avif-plugin

      - name: Build eagle AVIF assets and patch release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import pillow_avif

          root = Path(".")
          eagle = root / "assets/companions/eagle"

          for tier in (3, 5):
              src = eagle / f"eagle_combo_{tier}.webp"
              dst = eagle / f"eagle_combo_{tier}.avif"

              original = Image.open(src).convert("RGBA")
              print(src, "source_size=", original.size)
              img = original.convert("RGBa").resize((512, 512), Image.Resampling.LANCZOS).convert("RGBA")
              img.save(dst, "AVIF", quality=92, speed=6)

              check = Image.open(dst).convert("RGBA")
              assert check.size == (512, 512), (dst, check.size)
              amin, amax = check.getchannel("A").getextrema()
              assert amin < 255, (dst, "alpha channel lost")

          seg_path = root / "release/v9.9.3-direct/segment-24.txt"
          seg = seg_path.read_text(encoding="utf-8")
          old = "eagle:{3:'assets/companions/eagle/eagle_combo_3.webp',5:'assets/companions/eagle/eagle_combo_5.webp'},"
          new = "eagle:{3:'assets/companions/eagle/eagle_combo_3.avif',5:'assets/companions/eagle/eagle_combo_5.avif'},"
          assert old in seg, "eagle mapping anchor missing"
          seg = seg.replace(old, new, 1)
          seg_path.write_text(seg, encoding="utf-8")

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          assert "<title>DEEN v9.10.10</title>" in index, "version title anchor missing"
          assert "const BUILD='9110turtlehd1';" in index, "build anchor missing"
          index = index.replace("<title>DEEN v9.10.10</title>", "<title>DEEN v9.10.11</title>", 1)
          index = index.replace("const BUILD='9110turtlehd1';", "const BUILD='9111eaglehd1';", 1)
          index_path.write_text(index, encoding="utf-8")

          print("Generated:")
          for p in sorted(eagle.glob("eagle_combo_*.avif")):
              print(p, p.stat().st_size)
          PY

      - name: Commit generated assets and release patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eagle-hd-once.yml
          git add assets/companions/eagle/eagle_combo_3.avif \
                  assets/companions/eagle/eagle_combo_5.avif \
                  release/v9.9.3-direct/segment-24.txt \
                  index.html
          git commit -m "feat: add eagle HD AVIF combo assets (v9.10.11)"
          git push
