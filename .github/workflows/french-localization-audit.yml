name: French localization staging and UI inventory
on:
  push:
    branches: ['codex/french-*', main]
    paths:
      - 'assets/i18n/questions/fr/**'
      - 'assets/i18n/fr/**'
      - 'scripts/audit-french-staging.mjs'
      - 'scripts/audit-french-u01-complete.mjs'
      - 'scripts/audit-french-u02-complete.mjs'
      - 'scripts/audit-french-u03-complete.mjs'
      - 'scripts/audit-french-u04-complete.mjs'
      - 'scripts/audit-french-u05-complete.mjs'
      - 'scripts/audit-french-u06-complete.mjs'
      - 'scripts/audit-french-u07-complete.mjs'
      - 'scripts/audit-french-u08-complete.mjs'
      - 'scripts/audit-french-u09-complete.mjs'
      - 'scripts/audit-french-u10-complete.mjs'
      - 'scripts/audit-french-u11-complete.mjs'
      - 'scripts/audit-french-u12-complete.mjs'
      - 'scripts/audit-french-u13-complete.mjs'
      - 'scripts/audit-french-u14-complete.mjs'
      - 'scripts/audit-french-u15-complete.mjs'
      - 'qa/FRENCH_U15_TRANSLATION_GLOSSARY.json'
      - 'qa/FRENCH_U14_TRANSLATION_GLOSSARY.json'
      - 'qa/FRENCH_U13_TRANSLATION_GLOSSARY.json'
      - 'qa/FRENCH_U12_TRANSLATION_GLOSSARY.json'
      - 'scripts/inventory-french-ui.mjs'
      - 'scripts/audit-french-ui-core.mjs'
      - 'qa/FRENCH_STAGE1.md'
      - '.github/workflows/french-localization-audit.yml'
  workflow_dispatch:
jobs:
  french-staging:
    name: French source and coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate translated source IDs, answer indices and release gate
        run: node scripts/audit-french-staging.mjs
      - name: Verify all 100 French U01 questions, including matching and fill-blank
        run: node scripts/audit-french-u01-complete.mjs
      - name: Verify all 100 French U02 questions and answer structures
        run: node scripts/audit-french-u02-complete.mjs
      - name: Verify all 100 French U03 questions, recitation labels and sequences
        run: node scripts/audit-french-u03-complete.mjs
      - name: Verify all 100 French U04 questions and matching and blank structure
        run: node scripts/audit-french-u04-complete.mjs
      - name: Verify all 100 French U05 questions and source-aligned answer structures
        run: node scripts/audit-french-u05-complete.mjs
      - name: Verify U06 angels, all 100 French sources, answer positions and ordered tasks
        run: node scripts/audit-french-u06-complete.mjs
      - name: Verify 100 French U07 questions, answer indices, matches and sequence tasks
        run: node scripts/audit-french-u07-complete.mjs
      - name: Verify U08 French 100 question ID, answer, match, blank and sequence structures
        run: node scripts/audit-french-u08-complete.mjs
      - name: Verify U09 French 100 question IDs, answer indices, matches and sequences
        run: node scripts/audit-french-u09-complete.mjs
      - name: Verify U10 fate and decree 100 source-aligned French questions and answer structures
        run: node scripts/audit-french-u10-complete.mjs
      - name: Verify U11 100 worship questions and source-aligned French answers
        run: node scripts/audit-french-u11-complete.mjs
      - name: Verify 100 U12 ablution questions and jurisprudential answer integrity
        run: node scripts/audit-french-u12-complete.mjs
      - name: Verify all 100 U13 prayer questions and source mappings
        run: node scripts/audit-french-u13-complete.mjs
      - name: Verify U14 100 French prayer movements and original answer mappings
        run: node scripts/audit-french-u14-complete.mjs
      - name: Verify U15 Ramadan and fasting source, answers, and release safeguards
        run: node scripts/audit-french-u15-complete.mjs
      - name: Validate 197 new French core navigation, Quran and profile drafts
        run: node scripts/audit-french-ui-core.mjs
      - name: Report all 15 units and 1452 UI source keys
        run: node scripts/inventory-french-ui.mjs
      - name: Ensure production English questions remain complete
        run: node scripts/audit-english-questions.mjs --require-complete
      - name: Ensure no main loader hashes have changed
        run: node scripts/build-release-manifest.mjs --check
      - name: Store French missing-UI and high-risk dynamic coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-staging-inventory
          path: qa-artifacts/french-ui-inventory.json
          if-no-files-found: ignore
