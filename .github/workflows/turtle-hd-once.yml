name: One-off Turtle HD AVIF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/turtle-hd-once.yml"

permissions:
  contents: write

jobs:
  convert-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image codec
        run: python -m pip install --upgrade pillow pillow-avif-plugin

      - name: Build turtle AVIF assets and patch release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import pillow_avif

          root = Path(".")
          turtle = root / "assets/companions/turtle"

          for tier in (3, 5):
              src = turtle / f"turtle_combo_{tier}.webp"
              dst = turtle / f"turtle_combo_{tier}.avif"

              img = Image.open(src).convert("RGBA")
              # Alpha-aware high-quality upscale to 512x512.
              img = img.convert("RGBa").resize((512, 512), Image.Resampling.LANCZOS).convert("RGBA")
              img.save(dst, "AVIF", quality=92, speed=6)

              check = Image.open(dst).convert("RGBA")
              assert check.size == (512, 512), (dst, check.size)
              amin, amax = check.getchannel("A").getextrema()
              assert amin < 255, (dst, "alpha channel lost")

          seg_path = root / "release/v9.9.3-direct/segment-24.txt"
          seg = seg_path.read_text(encoding="utf-8")

          old_turtle = "turtle:{3:'assets/companions/turtle/turtle_combo_3.webp',5:'assets/companions/turtle/turtle_combo_5.webp'},"
          new_turtle = "turtle:{3:'assets/companions/turtle/turtle_combo_3.avif',5:'assets/companions/turtle/turtle_combo_5.avif'},"
          assert old_turtle in seg, "turtle mapping anchor missing"
          seg = seg.replace(old_turtle, new_turtle, 1)

          old_error = """   img.onerror=()=>{\n     const fallback=fallbackCompanionSrc();\n     if(fallback && img.src!==fallback)img.src=fallback;\n   };"""
          new_error = """   img.onerror=()=>{\n     const id=selectedCompanion();\n     const tier=(Number(combo)===5)?5:3;\n     const webp='assets/companions/'+id+'/'+id+'_combo_'+tier+'.webp?v='+BUILD;\n     if(!img.dataset.webpFallback && /\\.avif(?:\\?|$)/i.test(img.src)){\n       img.dataset.webpFallback='1';\n       img.src=webp;\n       return;\n     }\n     const fallback=fallbackCompanionSrc();\n     if(fallback && img.src!==fallback)img.src=fallback;\n   };"""
          assert old_error in seg, "combo fallback anchor missing"
          seg = seg.replace(old_error, new_error, 1)
          seg_path.write_text(seg, encoding="utf-8")

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          assert "<title>DEEN v9.10.9</title>" in index, "version title anchor missing"
          assert "const BUILD='9109wolfhd1';" in index, "build anchor missing"
          index = index.replace("<title>DEEN v9.10.9</title>", "<title>DEEN v9.10.10</title>", 1)
          index = index.replace("const BUILD='9109wolfhd1';", "const BUILD='9110turtlehd1';", 1)
          index_path.write_text(index, encoding="utf-8")

          print("Generated:")
          for p in sorted(turtle.glob("turtle_combo_*.avif")):
              print(p, p.stat().st_size)
          PY

      - name: Commit generated assets and release patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/turtle-hd-once.yml
          git add assets/companions/turtle/turtle_combo_3.avif \
                  assets/companions/turtle/turtle_combo_5.avif \
                  release/v9.9.3-direct/segment-24.txt \
                  index.html
          git commit -m "feat: add turtle HD AVIF combo assets (v9.10.10)"
          git push
