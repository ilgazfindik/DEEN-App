name: One-off Lion Cat HD AVIF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lion-cat-hd-once.yml"

permissions:
  contents: write

jobs:
  convert-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image codec
        run: python -m pip install --upgrade pillow pillow-avif-plugin

      - name: Build lion and cat AVIF assets and patch release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageFile
          import pillow_avif
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          root = Path(".")

          def load_source(animal, tier):
              preferred = root / "assets/companions" / animal / f"{animal}_combo_{tier}.webp"
              try:
                  im = Image.open(preferred).convert("RGBA")
                  im.load()
                  print("source", preferred, im.size)
                  return im, preferred, False
              except Exception as exc:
                  fallback = root / "assets/companions" / animal / f"{animal}_celebrate.png"
                  print("decode failed", preferred, repr(exc), "-> fallback", fallback)
                  im = Image.open(fallback).convert("RGBA")
                  im.load()
                  print("source", fallback, im.size)
                  return im, fallback, True

          def fit_square(im, size=512, inset=24):
              max_side = size - inset * 2
              scale = min(max_side / im.width, max_side / im.height)
              target = (max(1, round(im.width * scale)), max(1, round(im.height * scale)))
              resized = im.resize(target, Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              pos = ((size-target[0])//2, (size-target[1])//2)
              canvas.alpha_composite(resized, pos)
              return canvas

          repaired_webps = []

          for animal in ("lion", "cat"):
              folder = root / "assets/companions" / animal
              for tier in (3, 5):
                  original, source_path, used_fallback = load_source(animal, tier)
                  img = fit_square(original)

                  rgb = img.convert("RGB").filter(
                      ImageFilter.UnsharpMask(radius=1.1, percent=95, threshold=3)
                  )
                  alpha = img.getchannel("A")
                  img = Image.merge("RGBA", (*rgb.split(), alpha))

                  dst = folder / f"{animal}_combo_{tier}.avif"
                  img.save(dst, "AVIF", quality=92, speed=6)

                  check = Image.open(dst).convert("RGBA")
                  assert check.size == (512, 512), (dst, check.size)
                  amin, amax = check.getchannel("A").getextrema()
                  assert amin < 255, (dst, "alpha channel lost")
                  print("generated", dst, dst.stat().st_size, "alpha", (amin, amax))

                  # If the legacy WebP is corrupt, rebuild it too so browser fallback works.
                  if used_fallback:
                      webp = folder / f"{animal}_combo_{tier}.webp"
                      img.save(webp, "WEBP", lossless=True, method=6)
                      repaired_webps.append(webp)
                      verify = Image.open(webp).convert("RGBA")
                      verify.load()
                      assert verify.size == (512, 512)
                      print("repaired fallback", webp, webp.stat().st_size)

          seg_path = root / "release/v9.9.3-direct/segment-24.txt"
          seg = seg_path.read_text(encoding="utf-8")
          replacements = {
              "lion:{3:'assets/companions/lion/lion_combo_3.webp',5:'assets/companions/lion/lion_combo_5.webp'},":
              "lion:{3:'assets/companions/lion/lion_combo_3.avif',5:'assets/companions/lion/lion_combo_5.avif'},",
              "cat:{3:'assets/companions/cat/cat_combo_3.webp',5:'assets/companions/cat/cat_combo_5.webp'},":
              "cat:{3:'assets/companions/cat/cat_combo_3.avif',5:'assets/companions/cat/cat_combo_5.avif'},",
          }
          for old, new in replacements.items():
              assert old in seg, f"mapping anchor missing: {old}"
              seg = seg.replace(old, new, 1)

          for animal in ("lion", "cat", "eagle", "turtle", "owl", "wolf"):
              assert f"{animal}_combo_3.avif" in seg
              assert f"{animal}_combo_5.avif" in seg
          seg_path.write_text(seg, encoding="utf-8")

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          assert "<title>DEEN v9.10.11</title>" in index, "version title anchor missing"
          assert "const BUILD='9111eaglehd1';" in index, "build anchor missing"
          index = index.replace("<title>DEEN v9.10.11</title>", "<title>DEEN v9.10.12</title>", 1)
          index = index.replace("const BUILD='9111eaglehd1';", "const BUILD='9112allcomboshd1';", 1)
          index_path.write_text(index, encoding="utf-8")
          PY

      - name: Commit generated assets and release patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lion-cat-hd-once.yml
          git add assets/companions/lion/lion_combo_3.avif \
                  assets/companions/lion/lion_combo_5.avif \
                  assets/companions/lion/lion_combo_5.webp \
                  assets/companions/cat/cat_combo_3.avif \
                  assets/companions/cat/cat_combo_5.avif \
                  release/v9.9.3-direct/segment-24.txt \
                  index.html
          git commit -m "feat: migrate all combo mascots to HD AVIF (v9.10.12)"
          git push
