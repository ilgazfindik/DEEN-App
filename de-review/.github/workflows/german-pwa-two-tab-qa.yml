name: German PWA two-tab browser upgrade QA

on:
  push:
    branches: ['codex/german-*']
    paths:
      - 'sw.js'
      - 'scripts/test-german-pwa-two-tab.mjs'
      - '.github/workflows/german-pwa-two-tab-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-two-tab-upgrade:
    name: Preserve existing tabs, activate new worker, test offline recitation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser testing dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Check checked-in service worker and test syntax
        run: |
          node --check sw.js
          node --check scripts/test-german-pwa-two-tab.mjs
      - name: Exercise actual two-tab service-worker upgrade
        run: node scripts/test-german-pwa-two-tab.mjs
