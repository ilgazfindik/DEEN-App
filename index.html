 const CONCURRENCY=6;
 const CACHE_NAME='deen-release-'+BUILD;
 const segmentName=i=>'segment-'+String(i).padStart(2,'0')+'.txt';
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

 function validSegment(i,text){
   if(typeof text!=='string')return false;
   if(i===0&&!/^\s*<!doctype html>/i.test(text))return false;
   if(text.length<128&&!text.includes('DEEN_RETIRED_SEGMENT_OK'))return false;
   return true;
 }

 async function fetchText(url,timeoutMs){
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),timeoutMs);
   try{
     const r=await fetch(url,{cache:'no-store',signal:controller.signal});
     if(!r.ok)throw new Error('HTTP '+r.status);
     return await r.text();
   }finally{
     clearTimeout(timer);
   }
 }

 async function cacheOpen(){
   if(!('caches' in window))return null;
   try{return await caches.open(CACHE_NAME)}catch(_){return null}
 }

 async function cachedSegment(cache,key,i){
   if(!cache)return null;
   try{
     const hit=await cache.match(key);
     if(!hit)return null;
     const text=await hit.text();
     if(validSegment(i,text))return text;
     await cache.delete(key);
   }catch(_){}
   return null;
 }

 async function saveSegment(cache,key,text){
   if(!cache)return;
   try{
     await cache.put(key,new Response(text,{
       headers:{'Content-Type':'text/plain; charset=utf-8','X-DEEN-Build':BUILD}
     }));
   }catch(_){}
 }

 async function loadSegment(i,cache){
   const name=segmentName(i);
   const local='./release/v9.9.3-direct/'+name;
   const localKey=local+'?v='+BUILD;

   // Exact-build cache is safe: a new release always has a new BUILD token.
   const cached=await cachedSegment(cache,localKey,i);
   if(cached)return cached;

   const raw='https://raw.githubusercontent.com/ilgazfindik/DEEN-App/main/release/v9.9.3-direct/'+name;
   const attempts=[
     {url:localKey,timeout:6500},
     {url:local+'?v='+BUILD+'&retry=1',timeout:6500},
     {url:raw+'?v='+BUILD,timeout:9000}
   ];

   let lastError=null;
   for(let n=0;n<attempts.length;n++){
     try{
       const text=await fetchText(attempts[n].url,attempts[n].timeout);
       if(!validSegment(i,text))throw new Error('geçersiz veya eksik segment');
       await saveSegment(cache,localKey,text);
       return text;
     }catch(err){
       lastError=err;
       if(n<attempts.length-1)await sleep(220*(n+1));
     }
   }
   throw new Error('Release segment '+i+' yüklenemedi'+(lastError?.message?' ('+lastError.message+')':''));
 }

 async function loadAll(cache){
   const out=new Array(SEGMENT_COUNT);
   let cursor=0,done=0;
   async function worker(){
     while(true){
       const index=cursor++;
       if(index>=SEGMENT_COUNT)return;
       out[index]=await loadSegment(index,cache);
       done++;
       status.textContent='DEEN hazırlanıyor… '+done+'/'+SEGMENT_COUNT;
     }
   }
   const workers=Array.from({length:Math.min(CONCURRENCY,SEGMENT_COUNT)},()=>worker());
   await Promise.all(workers);
   return out;
 }

 function assemble(parts){
   let html=parts[0]+'\n'+parts[1]+'\n';
   for(let n=2;n<=8;n++)html+=parts[n];
   html+='\n';
   for(let n=9;n<parts.length;n++)html+=parts[n]+(n<parts.length-1?'\n':'');
   html=html.replace('<head>','<head><script>window.__DEEN_WORLD_RETIRED_RUNTIME__=true;window.__DEEN_LEGACY_AVATAR_RETIRED__=true;<\/script>');
   return html;
 }

 async function cleanupOldCaches(){
   if(!('caches' in window))return;
   try{
     const keys=await caches.keys();
     await Promise.all(keys
       .filter(k=>k.startsWith('deen-release-')&&k!==CACHE_NAME)
       .map(k=>caches.delete(k)));
   }catch(_){}
 }

 function showError(err){
   console.error(err);
   status.className='sub err';
   status.textContent='DEEN açılamadı: '+(err?.message||err);

   const wrap=document.createElement('div');
   wrap.style.marginTop='16px';

   const retry=document.createElement('button');
   retry.type='button';
   retry.textContent='Tekrar dene';
   retry.style.cssText='border:1px solid #47726d;background:#0b302f;color:#dff8ef;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer';
   retry.onclick=()=>location.reload();

   wrap.appendChild(retry);
   status.parentElement?.appendChild(wrap);
 }

 try{
   status.textContent='DEEN hazırlanıyor…';
   await cleanupOldCaches();
   const cache=await cacheOpen();
   const parts=await loadAll(cache);
   const html=assemble(parts);
   validateRelease(html);

   try{
     const u=new URL(location.href);
     if(u.searchParams.get('build')!==BUILD){
       u.searchParams.set('build',BUILD);
       history.replaceState(null,'',u.pathname+u.search+u.hash);
     }
   }catch(_){}

   window.__DEEN_DEPLOY_ID__=BUILD;
   document.open();
   document.write(html);
   document.close();
 }catch(err){
   showError(err);
 }
