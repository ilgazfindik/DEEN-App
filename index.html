<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DEEN v9.11.1</title>
<style>
html,body{margin:0;height:100%;background:#03131b;color:#eef7f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.logo{font-size:27px;font-weight:900;letter-spacing:5px;color:#91e2ca}
.sub{margin-top:12px;color:#9db4b8;font-size:13px}.err{color:#f1b0b4}
</style>
</head>
<body>
<div class="boot"><div><div class="logo">DEEN</div><div class="sub" id="status">DEEN yükleniyor…</div></div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 const BUILD='9202ctabold1';
 const SEGMENT_COUNT=35;
 const CONCURRENCY=6;
 const CACHE_NAME='deen-release-'+BUILD;
 const segmentName=i=>'segment-'+String(i).padStart(2,'0')+'.txt';
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

 function validSegment(i,text){
   if(typeof text!=='string')return false;
   if(i===0&&!/^\s*<!doctype html>/i.test(text))return false;
   if(text.length<128&&!text.includes('DEEN_RETIRED_SEGMENT_OK'))return false;
   return true;
 }

 async function fetchText(url,timeoutMs){
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),timeoutMs);
   try{
     const r=await fetch(url,{cache:'no-store',signal:controller.signal});
     if(!r.ok)throw new Error('HTTP '+r.status);
     return await r.text();
   }finally{
     clearTimeout(timer);
   }
 }

 async function cacheOpen(){
   if(!('caches' in window))return null;
   try{return await caches.open(CACHE_NAME)}catch(_){return null}
 }

 async function cachedSegment(cache,key,i){
   if(!cache)return null;
   try{
     const hit=await cache.match(key);
     if(!hit)return null;
     const text=await hit.text();
     if(validSegment(i,text))return text;
     await cache.delete(key);
   }catch(_){}
   return null;
 }

 async function saveSegment(cache,key,text){
   if(!cache)return;
   try{
     await cache.put(key,new Response(text,{
       headers:{'Content-Type':'text/plain; charset=utf-8','X-DEEN-Build':BUILD}
     }));
   }catch(_){}
 }

 async function loadSegment(i,cache){
   const name=segmentName(i);
   const local='./release/v9.9.3-direct/'+name;
   const localKey=local+'?v='+BUILD;

   // Exact-build cache is safe: a new release always has a new BUILD token.
   const cached=await cachedSegment(cache,localKey,i);
   if(cached)return cached;

   const raw='https://raw.githubusercontent.com/ilgazfindik/DEEN-App/main/release/v9.9.3-direct/'+name;
   const attempts=[
     {url:localKey,timeout:6500},
     {url:local+'?v='+BUILD+'&retry=1',timeout:6500},
     {url:raw+'?v='+BUILD,timeout:9000}
   ];

   let lastError=null;
   for(let n=0;n<attempts.length;n++){
     try{
       const text=await fetchText(attempts[n].url,attempts[n].timeout);
       if(!validSegment(i,text))throw new Error('geçersiz veya eksik segment');
       await saveSegment(cache,localKey,text);
       return text;
     }catch(err){
       lastError=err;
       if(n<attempts.length-1)await sleep(220*(n+1));
     }
   }
   throw new Error('Release segment '+i+' yüklenemedi'+(lastError?.message?' ('+lastError.message+')':''));
 }

 async function loadAll(cache){
   const out=new Array(SEGMENT_COUNT);
   let cursor=0,done=0;
   async function worker(){
     while(true){
       const index=cursor++;
       if(index>=SEGMENT_COUNT)return;
       out[index]=await loadSegment(index,cache);
       done++;
       status.textContent='DEEN hazırlanıyor… '+done+'/'+SEGMENT_COUNT;
     }
   }
   const workers=Array.from({length:Math.min(CONCURRENCY,SEGMENT_COUNT)},()=>worker());
   await Promise.all(workers);
   return out;
 }

 function assemble(parts){
   let html=parts[0]+'\n'+parts[1]+'\n';
   for(let n=2;n<=8;n++)html+=parts[n];
   html+='\n';
   for(let n=9;n<parts.length;n++)html+=parts[n]+(n<parts.length-1?'\n':'');
   html=html.replace('<head>','<head><script>window.__DEEN_WORLD_RETIRED_RUNTIME__=true;window.__DEEN_LEGACY_AVATAR_RETIRED__=true;<\/script>');
   return html;
 }

 function validateRelease(html){
   if(!html.startsWith('<!doctype html>'))throw new Error('Kaynak başlığı doğrulanamadı');

   const forbidden=[
     'deen-v874-admin-question-inspector-runtime',
     'deen-v875-admin-control-runtime',
     'deen-v980-content-audit-js',
     'DEEN_CONTENT_AUDIT',
     'deen-v990-beta-js',
     'DEEN_BETA_TEST',
     'deen-beta-open',
     'deen-v9910-admin-test-panel-js'
   ];
   const leaked=forbidden.find(marker=>html.includes(marker));
   if(leaked)throw new Error('Production güvenlik kontrolü başarısız: '+leaked);

   const required=[
     ['deen-v993-stage-intro-css','v9.9.3 bölüm giriş paketi eksik'],
     ['deen-v993-production-guard','Production guard eksik'],
     ['deen-v994-animal-companion-js','Hayvan yol arkadaşı paketi eksik'],
     ['deen-v995-world-retirement-js','Dünyam retirement paketi eksik'],
     ['deen-v996-onboarding-flow-js','Onboarding akış düzeltmesi eksik'],
     ['deen-v997-profile-companion-sync-js','Profil hayvan senkronizasyonu eksik'],
     ['deen-v998-premium-onboarding-js','Premium onboarding paketi eksik'],
     ['deen-v999-reference-hero-css','Referans onboarding görseli eksik'],
     ['deen-v999-animal-art-css','Hayvan görsel paketi eksik'],
     ['deen-v9912-auth-mock-js','Görsel giriş sağlayıcıları eksik'],
     ['deen-v9913-mobile-lesson-fit-js','Mobil ders sığdırma paketi eksik'],
     ['deen-v9914-ultra-clean-lesson-js','Ultra sade ders paketi eksik'],
     ['deen-v9916-duo-question-templates-js','Odaklı soru şablonları eksik'],
     ['deen-v9918-character-question-row-js','Karakterli soru satırı eksik'],
     ['deen-v9920-premium-fill-reference-js','Premium fill lesson paketi eksik'],
     ['deen-v9921-fill-dom-hotfix-js','Fill DOM hotfix paketi eksik'],
     ['deen-v9922-premium-fill-polish-js','Premium fill polish paketi eksik'],
     ['deen-v9923-companion-hero-cleanup-js','Companion hero cleanup paketi eksik'],
     ['deen-v9925-mascot-medallion-css','Mascot medallion paketi eksik'],
     ['deen-v9926-mascot-stability-css','Mascot stability paketi eksik'],
     ['deen-v9927-companion-stage-js','Companion stage paketi eksik'],
     ['deen-v9930-center-companion-row-js','Centered companion row paketi eksik'],
     ['deen-v9931-safe-center-rollback-js','Safe center rollback paketi eksik'],
     ['deen-v9933-screen-center-css','Strong screen center paketi eksik'],
     ['deen-v9934-fixed-vertical-center-js','Fixed vertical center paketi eksik'],
     ['deen-v9935-reference-balance-js','Reference balance paketi eksik'],
     ['deen-v9936-companion-runtime-js','Companion runtime paketi eksik'],
     ['deen-v9937-companion-lock-js','Companion lock paketi eksik'],
     ['deen-v9939-all-companions-js','All companions paketi eksik'],
     ['deen-v9941-boolean-screen-repair-js','Boolean screen repair paketi eksik'],
     ['deen-v9942-companion-polish-js','Companion polish paketi eksik'],
     ['deen-v9943-companion-weight-js','Companion visual-weight paketi eksik'],
     ['deen-v9944-companion-reactions-js','Companion reaction paketi eksik'],
     ['deen-v9945-feedback-layout-js','Feedback layout paketi eksik'],
     ['deen-v9946-unified-companion-layout-js','Unified companion layout paketi eksik'],
     ['deen-v9947-final-companion-stabilization-js','Final companion stabilization paketi eksik'],
     ['deen-v9948-no-human-guide-js','No-human-guide paketi eksik'],
     ['deen-v9950-companion-streak-js','Companion streak direct paketi eksik'],
     ['deen-v9953-runtime-arbiter-js','Runtime arbiter paketi eksik'],
     ['deen-v9988-runtime-regression-js','Runtime regression guard eksik'],
     ['deen-v9988-release-freeze-js','Release freeze manifest eksik'],
     ['deen-v9991-streak-reaction-bridge-js','Streak reaction bridge eksik'],
     ['deen-v9992-feedback-companion-persistence-js','Feedback companion persistence eksik'],
     ['deen-v9993-question-transition-js','Question transition stabilizer eksik'],
     ['deen-v9994-combo-media-js','3x combo media overlay eksik'],
     ['deen-v9995-combo-ensure-js','Guaranteed 3x combo trigger eksik'],
     ['deen-v9996-combo-webm-js','3x combo WEBM celebration eksik'],
     ['deen-v9997-combo-canvas-js','Lion combo canvas transparency fix eksik'],
     ['deen-v9998-combo-motion-marker','Combo bottom-up motion refinement eksik'],
     ['deen-v9999-combo-visibility-marker','Combo visibility watchdog eksik'],
     ['deen-v9100-combo-visibility-final-marker','Combo final visibility fix eksik'],
     ['deen-v9101-single-companion-combo-js','Single selected companion combo eksik'],
     ['deen-v9102-authoritative-combo-js','Authoritative selected companion combo eksik'],
     ['deen-v9103-direct-combo-js','Direct session combo celebration eksik'],
     ['deen-v9104-lion-hires-marker','High-quality lion combo source eksik'],
     ['deen-v9105-lion-asset-fix-marker','Complete lion combo asset fix eksik'],
     ['deen-v9106-combo-tier-marker','3x/5x companion tier system eksik'],
     ['deen-v1042-fill-balance-css','Fill viewport balance paketi eksik'],
     ['deen-v1043-fill-feedback-handoff-css','Fill feedback handoff paketi eksik'],
     ['deen-v1044-fill-freeze-js','Fill regression freeze paketi eksik'],
     ['deen-v1045-matching-baseline-js','Matching authoritative baseline paketi eksik'],
     ['deen-v1053-isolated-matching-engine-js','Isolated matching engine eksik'],
     ['deen-v1054-matching-debug-js','Matching debug paketi eksik'],
     ['deen-v1059-matching-freeze-js','Matching freeze paketi eksik'],
     ['deen-v1060-matching-polish-css','Matching visual polish paketi eksik'],
     ['deen-v1061-matching-final-polish-css','Final matching polish paketi eksik'],
     ['deen-v1062-badge-art-css','Achievement badge artwork paketi eksik'],
     ['deen-v1064-premium-welcome-css','Premium welcome screen paketi eksik'],
     ['deen-v1065-welcome-rebuild-css','Welcome rebuild paketi eksik'],
     ['deen-v1066-welcome-final-polish-css','Welcome final polish paketi eksik'],
     ['deen-v1067-auth-logo-fix-css','Auth logo fix paketi eksik'],
     ['deen-v1069-onboarding-animal-hq-css','HQ onboarding hayvan görsel paketi eksik'],
     ['deen-v1070-animal-cards-individual-css','Bireysel HQ hayvan kartları paketi eksik'],
     ['deen-v1072-onboarding-atlas-loader-css','HQ hayvan atlası asset loader eksik'],
     ['deen-v1073-onboarding-inline-atlas-css','Inline HQ hayvan atlası eksik'],
     ['deen-v1077-profile-avatar-assets-css','Profil şeffaf maskot görsel paketi eksik'],
     ['deen-v1088-legacy-neon-persist-css','Kalıcı legacy neon ve bölüm giriş paketi eksik'],
     ['deen-v1089-multilingual-typography-css','Çok dilli tipografi paketi eksik'],
     ['deen-v1090-readability-guard-css','Global okunabilirlik paketi eksik'],
     ['deen-v1091-typography-freeze-css','Tipografi freeze paketi eksik'],
     ['deen-v1092-luxury-neon-home-css','Luxury neon ana ekran paketi eksik']
   ];
   const missing=required.find(([marker])=>!html.includes(marker));
   if(missing)throw new Error(missing[1]);
   return true;
 }

 async function cleanupOldCaches(){
   if(!('caches' in window))return;
   try{
     const keys=await caches.keys();
     await Promise.all(keys
       .filter(k=>k.startsWith('deen-release-')&&k!==CACHE_NAME)
       .map(k=>caches.delete(k)));
   }catch(_){}
 }

 function showError(err){
   console.error(err);
   status.className='sub err';
   status.textContent='DEEN açılamadı: '+(err?.message||err);

   const wrap=document.createElement('div');
   wrap.style.marginTop='16px';

   const retry=document.createElement('button');
   retry.type='button';
   retry.textContent='Tekrar dene';
   retry.style.cssText='border:1px solid #47726d;background:#0b302f;color:#dff8ef;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer';
   retry.onclick=()=>location.reload();

   wrap.appendChild(retry);
   status.parentElement?.appendChild(wrap);
 }

 try{
   status.textContent='DEEN hazırlanıyor…';
   const cache=await cacheOpen();
   const parts=await loadAll(cache);
   const html=assemble(parts);
   validateRelease(html);
   await cleanupOldCaches();

   window.__DEEN_DEPLOY_ID__=BUILD;
   document.open();
   document.write(html);
   document.close();
 }catch(err){
   showError(err);
 }
})();
</script>
</body>
</html>
