 async function validSegment(i,text){
   if(typeof text!=='string')return false;
   if(i===0&&!/^\s*<!doctype html>/i.test(text))return false;
   if(text.length<128&&!text.includes('DEEN_RETIRED_SEGMENT_OK'))return false;
   if(!SEGMENT_HASHES[i])return false;
   const bytes=new TextEncoder().encode(text);
   const digest=await crypto.subtle.digest('SHA-256',bytes);
   const hash=Array.from(new Uint8Array(digest),n=>n.toString(16).padStart(2,'0')).join('');
   return hash===SEGMENT_HASHES[i];
 }

 async function fetchText(url,timeoutMs){
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),timeoutMs);
   try{
     const r=await fetch(url,{cache:'no-store',signal:controller.signal});
     if(!r.ok)throw new Error('HTTP '+r.status);
     return await r.text();
   }finally{
     clearTimeout(timer);
   }
 }

 async function cachedSegment(cache,key,i){
   if(!cache)return null;
   try{
     const hit=await cache.match(key);
     if(!hit)return null;
     const text=await hit.text();
     if(await validSegment(i,text))return text;
     await cache.delete(key);
   }catch(_){}
   return null;
 }

 async function saveSegment(cache,key,text){
   if(!cache)return;
   try{
     await cache.put(key,new Response(text,{
       headers:{'Content-Type':'text/plain; charset=utf-8','X-DEEN-Build':BUILD}
     }));
   }catch(_){}
 }

 async function loadSegment(i,cache){
   const name=segmentName(i);
   const local='./release/v9.9.3-direct/'+name;
   const localKey=local+'?v='+BUILD;

   // Exact-build cache is safe: a new release always has a new BUILD token.
   const cached=await cachedSegment(cache,localKey,i);
   if(cached)return cached;

   const attempts=[{url:localKey,timeout:6500},{url:local+'?v='+BUILD+'&retry=1',timeout:6500}];

   let lastError=null;
   for(let n=0;n<attempts.length;n++){
     try{
       const text=await fetchText(attempts[n].url,attempts[n].timeout);
       if(!await validSegment(i,text))throw new Error('geçersiz veya eksik segment');
       await saveSegment(cache,localKey,text);
       return text;
     }catch(err){
       lastError=err;
       if(n<attempts.length-1)await sleep(220*(n+1));
     }
   }
   throw new Error('Release segment '+i+' yüklenemedi'+(lastError?.message?' ('+lastError.message+')':''));
 }

 async function loadAll(cache){
   const out=new Array(SEGMENT_COUNT);
   let cursor=0,done=0;
   async function worker(){
     while(true){
       const index=cursor++;
       if(index>=SEGMENT_COUNT)return;
       out[index]=await loadSegment(index,cache);
       done++;
       const progress=Math.floor(done/SEGMENT_COUNT*90);
       status.textContent=window.__DEEN_BOOT_SELECTED_LANGUAGE__==='ar'?'جارٍ فتح DEEN…':'DEEN açılıyor…';
       const bar=document.getElementById('deen-boot-progress-fill');
       if(bar)bar.style.width=progress+'%';
     }
   }
   const workers=Array.from({length:Math.min(CONCURRENCY,SEGMENT_COUNT)},()=>worker());
   await Promise.all(workers);
   return out;
 }

 function assemble(parts){
   let html=parts[0]+'\n'+parts[1]+'\n';
   for(let n=2;n<=8;n++)html+=parts[n];
   html+='\n';
   for(let n=9;n<parts.length;n++)html+=parts[n]+(n<parts.length-1?'\n':'');
   html=html.replace('<head>','<head><script>window.__DEEN_WORLD_RETIRED_RUNTIME__=true;window.__DEEN_LEGACY_AVATAR_RETIRED__=true;<\/script>');
   return html;

 async function cleanupOldCaches(){
   if(!('caches' in window))return;
   try{
     const keys=await caches.keys();
     await Promise.all(keys
       .filter(k=>k.startsWith('deen-release-')&&k!==CACHE_NAME)
       .map(k=>caches.delete(k)));
   }catch(_){}
 }

 function showError(err){
   console.error(err);
   status.className='sub err';
   status.textContent=(window.__DEEN_BOOT_SELECTED_LANGUAGE__==='ar'?'تعذّر فتح DEEN: ':'DEEN açılamadı: ')+(err?.message||err);

   const wrap=document.createElement('div');
   wrap.style.marginTop='16px';

   const retry=document.createElement('button');
   retry.type='button';
   retry.textContent=window.__DEEN_BOOT_SELECTED_LANGUAGE__==='ar'?'حاول مجددًا':'Tekrar dene';
   retry.style.cssText='border:1px solid #47726d;background:#0b302f;color:#dff8ef;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer';
   retry.onclick=()=>location.reload();

   wrap.appendChild(retry);
   status.parentElement?.appendChild(wrap);
 }

 try{
   // Render a lightweight first-run gate before the 67-segment application starts.
   // This keeps the entry screen responsive even if the legacy application hangs.
   await new Promise(resolve=>{
     const saved=localStorage.getItem('deen_app_language_v1');
     if(['tr','ar','en','de','es','fr'].includes(saved)){window.__DEEN_BOOT_SELECTED_LANGUAGE__=saved;resolve();return}
     const parent=status.parentElement;
     status.textContent='Önce dilini seç, ardından uygulamaya geç.';
     const panel=document.createElement('div');
     panel.style.cssText='margin:20px auto 0;max-width:320px;display:grid;gap:12px;text-align:left';
     const label=document.createElement('label');
     label.textContent='Uygulama dili';
     label.style.cssText='display:block;color:#dff8ef;font-size:14px;font-weight:700';
     const select=document.createElement('select');
     select.setAttribute('aria-label','Uygulama dili');
     select.style.cssText='width:100%;box-sizing:border-box;padding:14px;border-radius:12px;background:#0e3039;color:#fff;border:1px solid #507a76;font-size:16px';
     for(const [value,title] of [['tr','Türkçe'],['ar','العربية'],['en','English'],['de','Deutsch'],['es','Español'],['fr','Français']]){
       const option=document.createElement('option');option.value=value;option.textContent=title;select.appendChild(option);
     }
     const start=document.createElement('button');start.type='button';start.textContent='Devam et';
     start.style.cssText='padding:14px;border:0;border-radius:12px;background:#31efcf;color:#06212b;font-size:16px;font-weight:800;cursor:pointer';
     const help=document.createElement('div');help.textContent='Dilini seçtikten sonra DEEN hazırlanacak. Mevcut ilerlemen silinmez.';
     help.style.cssText='color:#93afb3;font-size:12px;line-height:1.5;text-align:center';
     // The chosen locale applies to the language gate itself, before app code loads.
     const gateCopy={
       tr:['Önce dilini seç, ardından uygulamaya geç.','Uygulama dili','Devam et','Dilini seçtikten sonra DEEN hazırlanacak. Mevcut ilerlemen silinmez.'],
       ar:['اختر لغتك أولًا، ثم تابع إلى التطبيق.','لغة التطبيق','متابعة','سيتم تجهيز DEEN بعد اختيار اللغة. سيُحفظ تقدّمك الحالي.'],
       en:['Choose your language, then continue.','App language','Continue','DEEN will be prepared after you choose a language. Your progress is preserved.'],
       de:['Wähle deine Sprache und fahre fort.','App-Sprache','Weiter','DEEN wird nach der Sprachauswahl vorbereitet. Dein Fortschritt bleibt erhalten.'],
       es:['Elige tu idioma y continúa.','Idioma de la aplicación','Continuar','DEEN se preparará después de elegir el idioma. Tu progreso se conserva.'],
       fr:['Choisis ta langue, puis continue.','Langue de l’application','Continuer','DEEN sera préparé après le choix de la langue. Ta progression est conservée.']
     };
     function renderGate(){
       const copy=gateCopy[select.value];
       status.textContent=copy[0];label.textContent=copy[1];select.setAttribute('aria-label',copy[1]);
       start.textContent=copy[2];help.textContent=copy[3];
       document.documentElement.lang=select.value;panel.dir=select.value==='ar'?'rtl':'ltr';panel.style.textAlign='start';
     }
     select.addEventListener('change',renderGate);renderGate();
     panel.append(label,select,start,help);parent.appendChild(panel);
     start.addEventListener('click',()=>{
       window.__DEEN_BOOT_SELECTED_LANGUAGE__=select.value;
       SEGMENT_COUNT=67;
       // Expose preference for the main app; its original onboarding remains authoritative.
       try{sessionStorage.setItem('deen_boot_language',select.value);localStorage.setItem('deen_app_language_v1',select.value)}catch(_){}
       panel.remove();resolve();
     },{once:true});
   });
   status.textContent=window.__DEEN_BOOT_SELECTED_LANGUAGE__==='ar'?'جارٍ فتح DEEN…':'DEEN açılıyor…';
   await cleanupOldCaches();
   const cache=await cacheOpen();
   const parts=await loadAll(cache);
   let html=assemble(parts);
   html=html.replace('<head>','<head><link rel="stylesheet" href="./assets/i18n/boot.css?v='+BUILD+'"><script src="./assets/i18n/boot.js?v='+BUILD+'"><\/script>');
   html+='<script>DEEN_BOOT.start()<\/script>';

   validateRelease(html);
   status.textContent=window.__DEEN_BOOT_SELECTED_LANGUAGE__==='ar'?'جارٍ بدء DEEN…':'DEEN başlatılıyor…';
   await new Promise(resolve=>setTimeout(resolve,180));

   try{
     const u=new URL(location.href);
     if(u.searchParams.get('build')!==BUILD){
       u.searchParams.set('build',BUILD);
       history.replaceState(null,'',u.pathname+u.search+u.hash);
     }
   }catch(_){}

   window.__DEEN_DEPLOY_ID__=BUILD;
   document.open();
   document.write(html);
   document.close();
 }catch(err){
   showError(err);
 }
})();
</script>
