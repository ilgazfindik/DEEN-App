   if(typeof window.DEEN_PATCH_V775!=='function')throw new Error('v7.7.5 yaması yüklenemedi.');

   if(typeof window.DEEN_PATCH_V780!=='function')throw new Error('v7.8.0 yaması yüklenemedi.');
   const p775=window.DEEN_PATCH_V775(html);html=p775.html;

   const p777=window.DEEN_PATCH_V777(html);html=p777.html;

   if(p780.applied<1)console.warn('DEEN v7.8.0 patch already present or not applied');
   document.open();document.write(html);document.close();
 }catch(err){
   console.error(err);status.className='sub err';status.textContent='DEEN açılamadı: '+(err?.message||err);
 }
