<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEEN v7.7.5</title>
<style>
html,body{margin:0;background:#07151c;color:#eef7f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%}.boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:320px}.logo{font-size:26px;font-weight:900;letter-spacing:5px;color:#91e2ca}.sub{margin-top:12px;color:#9db4b8;font-size:13px;line-height:1.5}.err{color:#f1b0b4}
</style>
<script src="./patches/v7.7.5.js?v=775"></script>
</head>
<body>
<div class="boot"><div class="box"><div class="logo">DEEN</div><div class="sub" id="status">v7.7.5 Dünyam güncellemesi yükleniyor…</div></div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   const r=await fetch('./DEEN_v7_7_4_AVATAR_PERSIST_WORLD_STABILITY.html?v=775',{cache:'no-store'});
   if(!r.ok)throw new Error('Ana DEEN dosyası yüklenemedi.');
   const base=await r.text();
   if(typeof window.DEEN_PATCH_V775!=='function')throw new Error('v7.7.5 yaması yüklenemedi.');
   const patched=window.DEEN_PATCH_V775(base);
   if(patched.applied<5)console.warn('DEEN v7.7.5: expected 5 patch targets, applied',patched.applied);
   document.open();document.write(patched.html);document.close();
 }catch(err){
   console.error(err);status.className='sub err';status.textContent='DEEN açılamadı: '+(err?.message||err);
 }
})();
</script>
</body>
</html>
