<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DEEN v9.9.34</title>
<style>
html,body{margin:0;height:100%;background:#03131b;color:#eef7f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.logo{font-size:27px;font-weight:900;letter-spacing:5px;color:#91e2ca}
.sub{margin-top:12px;color:#9db4b8;font-size:13px}.err{color:#f1b0b4}
</style>
</head>
<body>
<div class="boot"><div><div class="logo">DEEN</div><div class="sub" id="status">DEEN yükleniyor…</div></div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   const BUILD='9934fixedcenter1';
   const segmentName=i=>'segment-'+String(i).padStart(2,'0')+'.txt';
   const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
   async function loadSegment(i){
     const name=segmentName(i);
     const local='./release/v9.9.3-direct/'+name;
     const raw='https://raw.githubusercontent.com/ilgazfindik/DEEN-App/main/release/v9.9.3-direct/'+name;
     const attempts=[
       local+'?v='+BUILD,
       local+'?v='+BUILD+'&retry=1',
       raw+'?v='+BUILD
     ];
     let lastStatus='';
     let lastError=null;
     for(let n=0;n<attempts.length;n++){
       try{
         const r=await fetch(attempts[n],{cache:'no-store'});
         lastStatus=String(r.status||'');
         if(r.ok)return await r.text();
       }catch(err){lastError=err}
       if(n<attempts.length-1)await sleep(280*(n+1));
     }
     const detail=lastStatus?' (HTTP '+lastStatus+')':(lastError?.message?' ('+lastError.message+')':'');
     throw new Error('Release segment '+i+' yüklenemedi'+detail);
   }
   status.textContent='DEEN hazırlanıyor…';
   const s=await Promise.all(Array.from({length:25},(_,i)=>loadSegment(i)));
   let html=s[0]+'\n'+s[1]+'\n';
   for(let i=2;i<=8;i++) html+=s[i];
   html+='\n';
   for(let i=9;i<s.length;i++) html+=s[i]+(i<s.length-1?'\n':'');
   if(!html.startsWith('<!doctype html>'))throw new Error('Kaynak başlığı doğrulanamadı');
   if(!html.includes('deen-v993-stage-intro-css'))throw new Error('v9.9.3 bölüm giriş paketi eksik');
   const forbidden=['deen-v874-admin-question-inspector-runtime','deen-v875-admin-control-runtime','deen-v980-content-audit-js','DEEN_CONTENT_AUDIT','deen-v990-beta-js','DEEN_BETA_TEST','deen-beta-open'];
   const leaked=forbidden.find(marker=>html.includes(marker));
   if(leaked)throw new Error('Production güvenlik kontrolü başarısız: '+leaked);
   if(!html.includes('deen-v993-production-guard'))throw new Error('Production guard eksik');
   if(!html.includes('deen-v994-animal-companion-js'))throw new Error('Hayvan yol arkadaşı paketi eksik');
   if(!html.includes('deen-v995-world-retirement-js'))throw new Error('Dünyam retirement paketi eksik');
   if(!html.includes('deen-v996-onboarding-flow-js'))throw new Error('Onboarding akış düzeltmesi eksik');
   if(!html.includes('deen-v997-profile-companion-sync-js'))throw new Error('Profil hayvan senkronizasyonu eksik');
   if(!html.includes('deen-v998-premium-onboarding-js'))throw new Error('Premium onboarding paketi eksik');
   if(!html.includes('deen-v999-reference-hero-css'))throw new Error('Referans onboarding görseli eksik');
   if(!html.includes('deen-v999-animal-art-css'))throw new Error('Hayvan görsel paketi eksik');
   if(!html.includes('deen-v9910-admin-test-panel-js'))throw new Error('Admin test paneli eksik');
   if(!html.includes('deen-v9912-auth-mock-js'))throw new Error('Görsel giriş sağlayıcıları eksik');
   if(!html.includes('deen-v9913-mobile-lesson-fit-js'))throw new Error('Mobil ders sığdırma paketi eksik');
   if(!html.includes('deen-v9914-ultra-clean-lesson-js'))throw new Error('Ultra sade ders paketi eksik');
   if(!html.includes('deen-v9916-duo-question-templates-js'))throw new Error('Odaklı soru şablonları eksik');
   if(!html.includes('deen-v9918-character-question-row-js'))throw new Error('Karakterli soru satırı eksik');
   if(!html.includes('deen-v9920-premium-fill-reference-js'))throw new Error('Premium fill lesson paketi eksik');
   if(!html.includes('deen-v9921-fill-dom-hotfix-js'))throw new Error('Fill DOM hotfix paketi eksik');
   if(!html.includes('deen-v9922-premium-fill-polish-js'))throw new Error('Premium fill polish paketi eksik');
   if(!html.includes('deen-v9923-companion-hero-cleanup-js'))throw new Error('Companion hero cleanup paketi eksik');
   if(!html.includes('deen-v9924-companion-asset-reset-js'))throw new Error('Companion asset reset paketi eksik');
   if(!html.includes('deen-v9925-mascot-medallion-js'))throw new Error('Mascot medallion paketi eksik');
   if(!html.includes('deen-v9926-mascot-stability-js'))throw new Error('Mascot stability paketi eksik');
   if(!html.includes('deen-v9927-companion-stage-js'))throw new Error('Companion stage paketi eksik');
   if(!html.includes('deen-v9929-vector-companion-js'))throw new Error('Vector companion paketi eksik');
   if(!html.includes('deen-v9930-center-companion-row-js'))throw new Error('Centered companion row paketi eksik');
   if(!html.includes('deen-v9931-safe-center-rollback-js'))throw new Error('Safe center rollback paketi eksik');
   if(!html.includes('deen-v9932-screen-center-js'))throw new Error('Screen center paketi eksik');
   if(!html.includes('deen-v9933-screen-center-js'))throw new Error('Strong screen center paketi eksik');
   if(!html.includes('deen-v9934-fixed-vertical-center-js'))throw new Error('Fixed vertical center paketi eksik');
   window.__DEEN_DEPLOY_ID__='9934fixedcenter1';
   document.open();document.write(html);document.close();
 }catch(err){
   console.error(err);status.className='sub err';status.textContent='DEEN açılamadı: '+(err?.message||err);
 }
})();
</script>
</body>
</html>
