<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DEEN v9.9.3</title>
<style>
html,body{margin:0;height:100%;background:#03131b;color:#eef7f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.logo{font-size:27px;font-weight:900;letter-spacing:5px;color:#91e2ca}
.sub{margin-top:12px;color:#9db4b8;font-size:13px}.err{color:#f1b0b4}
</style>
</head>
<body>
<div class="boot"><div><div class="logo">DEEN</div><div class="sub" id="status">v9.9.3 yükleniyor…</div></div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 const parts=["./release/v9.9.3-direct/segment-00.txt?v=993direct1","./release/v9.9.3-direct/segment-01.txt?v=993direct1","./release/v9.9.3-direct/segment-02.txt?v=993direct1","./release/v9.9.3-direct/segment-03.txt?v=993direct1","./release/v9.9.3-direct/segment-04.txt?v=993direct1","./release/v9.9.3-direct/segment-05.txt?v=993direct1","./release/v9.9.3-direct/segment-06.txt?v=993direct1","./release/v9.9.3-direct/segment-07.txt?v=993direct1","./release/v9.9.3-direct/segment-08.txt?v=993direct1","./release/v9.9.3-direct/segment-09.txt?v=993direct1","./release/v9.9.3-direct/segment-10.txt?v=993direct1","./release/v9.9.3-direct/segment-11.txt?v=993direct1","./release/v9.9.3-direct/segment-12.txt?v=993direct1","./release/v9.9.3-direct/segment-13.txt?v=993direct1","./release/v9.9.3-direct/segment-14.txt?v=993direct1","./release/v9.9.3-direct/segment-15.txt?v=993direct1","./release/v9.9.3-direct/segment-16.txt?v=993direct1","./release/v9.9.3-direct/segment-17.txt?v=993direct1","./release/v9.9.3-direct/segment-18.txt?v=993direct1","./release/v9.9.3-direct/segment-19.txt?v=993direct1","./release/v9.9.3-direct/segment-20.txt?v=993direct1","./release/v9.9.3-direct/segment-21.txt?v=993direct1","./release/v9.9.3-direct/segment-22.txt?v=993direct1","./release/v9.9.3-direct/segment-23.txt?v=993direct1","./release/v9.9.3-direct/segment-24.txt?v=993direct1"];
 try{
   const responses=await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'})));
   responses.forEach((r,i)=>{if(!r.ok)throw new Error('Release segment '+i+' yüklenemedi');});
   const html=(await Promise.all(responses.map(r=>r.text()))).join('');
   if(!html.startsWith('<!doctype html>')||!html.includes('DEEN_BETA_TEST')||!html.includes('deen-v993-stage-intro-css'))throw new Error('v9.9.3 doğrulaması başarısız');
   document.open();document.write(html);document.close();
 }catch(err){
   console.error(err);status.className='sub err';status.textContent='DEEN açılamadı: '+(err?.message||err);
 }
})();
</script>
</body>
</html>
