<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DEEN v7.7.4</title><style>html,body{margin:0;background:#07151c;color:#eef7f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%}.boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:320px}.logo{font-size:26px;font-weight:900;letter-spacing:5px}.sub{margin-top:12px;color:#9db4b8;font-size:13px;line-height:1.5}.err{color:#f1b0b4}</style></head><body><div class="boot"><div class="box"><div class="logo">DEEN</div><div class="sub" id="status">Uygulama yükleniyor…</div></div></div><script>
(async()=>{const status=document.getElementById('status');try{if(!('DecompressionStream'in window))throw new Error('Bu tarayıcı sıkıştırılmış uygulamayı açamıyor. Safari/Chrome güncellemesi gerekebilir.');const paths=['releases/v7.7.4/app.part01.bin','releases/v7.7.4/app.part02.bin','releases/v7.7.4/app.part03.bin','releases/v7.7.4/app.part04.bin','releases/v7.7.4/app.part05.bin','releases/v7.7.4/app.part06.bin'];const bufs=await Promise.all(paths.map(async p=>{const r=await fetch(p+'?v=7.7.4',{cache:'no-store'});if(!r.ok)throw new Error('Uygulama paketi yüklenemedi: '+p);return new Uint8Array(await r.arrayBuffer())}));const total=bufs.reduce((n,b)=>n+b.length,0),merged=new Uint8Array(total);let off=0;for(const b of bufs){merged.set(b,off);off+=b.length}const stream=new Blob([merged]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(err){console.error(err);status.className='sub err';status.textContent='DEEN açılamadı: '+(err?.message||err)}})();
</script></body></html>
